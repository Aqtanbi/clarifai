<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClarifAI — диагностика</title>
<style>
body{margin:0;background:#F7F6F9;color:#121117;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px}
h1{font-size:24px;margin:0 0 8px}p{color:#55525F;margin:0 0 20px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #E4E4E7}
td,th{padding:10px 12px;border-bottom:1px solid #EEECF3;text-align:left;vertical-align:top;font-size:14px}
.ok{color:#15803D;font-weight:700}.bad{color:#E11D48;font-weight:700}
code{background:#EEECF3;padding:1px 5px;border-radius:4px}
</style></head><body><main>
<h1>Диагностика сайта ClarifAI</h1>
<p>Страница отправляет на сервер тестовые запросы и показывает, какие из них пропускает хостинг. Сделайте скриншот таблицы.</p>
<p id="health">Проверяю сервер…</p>
<table><thead><tr><th>Запрос</th><th>Результат</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
const rows = document.getElementById('rows');
const enc = s => btoa(unescape(encodeURIComponent(s)));
function form(fields) { const f = new FormData(); for (const [k, v] of Object.entries(fields)) f.append(k, v); return f; }
const tests = [
  ['GET /api/health', () => fetch('/api/health')],
  ['POST пустой', () => fetch('/api/echo', {method: 'POST'})],
  ['POST форма: простой текст', () => fetch('/api/echo', {method: 'POST', body: form({note: 'привет, это тест'})})],
  ['POST форма: файл .md с обычным текстом', () => fetch('/api/echo', {method: 'POST', body: form({file: new File(['# Тест\nФ-1. Требование.'], 'a.md')})})],
  ['POST форма: текст с curl и Bearer', () => fetch('/api/echo', {method: 'POST', body: form({note: 'curl -G "$BASE/x" -H "Authorization: Bearer $TOKEN"'})})],
  ['POST форма: base64 (как отправляет сайт)', () => fetch('/api/echo', {method: 'POST', body: form({file_b64: enc('curl -H "Authorization: Bearer x"'.repeat(50)), filename: 'a.md', encoding: 'raw'})})],
  ['POST форма: поле api_key вида AIza…', () => fetch('/api/echo', {method: 'POST', body: form({api_key: 'AIzaSyD-FAKE-KEY-0000000000000000000', access_code: 'qwerty123'})})],
  ['POST JSON', () => fetch('/api/echo', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({a: 1})})],
  ['POST /api/validate без файла', () => fetch('/api/validate', {method: 'POST', body: form({access_code: 'qwerty123'})})],
];
(async () => {
  try { const h = await (await fetch('/api/health')).json();
    document.getElementById('health').innerHTML = `Сервер: версия <code>${h.version}</code>, коммит <code>${h.commit || 'неизвестен'}</code>, модель <code>${h.model}</code>`;
  } catch (e) { document.getElementById('health').textContent = 'Сервер не отвечает: ' + e.message; }
  for (const [name, run] of tests) {
    const tr = document.createElement('tr'); tr.innerHTML = `<td>${name}</td><td>…</td>`; rows.appendChild(tr);
    try {
      const r = await run(); const t = (await r.text()).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      const blocked = r.status === 403 && /Blocked/i.test(t);
      tr.lastChild.innerHTML = `<span class="${r.ok || r.status === 400 ? 'ok' : 'bad'}">HTTP ${r.status}${blocked ? ' — заблокировано хостингом' : ''}</span><br><small>${t.slice(0, 120).replace(/</g, '&lt;')}</small>`;
    } catch (e) { tr.lastChild.innerHTML = `<span class="bad">сбой: ${e.message}</span>`; }
  }
})();
</script></body></html>
